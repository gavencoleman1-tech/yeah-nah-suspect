<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>The 100 Excuses Pack</title>
<style>
body{margin:0;background:#f4c430;color:#241f12;font:17px/1.5 system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 18px 50px}
h1{font:900 30px/1.1 Georgia,serif;margin:8px 0 6px}
h2{font:900 21px Georgia,serif;margin:28px 0 8px;border-bottom:3px solid #241f12;padding-bottom:4px}
.sub{margin:0 0 16px;color:#6b5d2e;font-weight:600}
button{font:600 16px system-ui;padding:13px 16px;background:#241f12;color:#f4c430;border:0;width:100%}
.pick{background:#fffbea;border:2px dashed #241f12;padding:14px;font:700 20px/1.3 Georgia,serif;min-height:24px}
ol{padding-left:0;list-style:none;margin:0}
li{background:#fffbea;margin:0 0 8px;padding:11px 12px;cursor:pointer;border-left:6px solid #c4311b}
li b{color:#c4311b;margin-right:6px}
a{color:#241f12;font-weight:600}
</style></head><body><main>
<h1>The 100 Excuses Pack</h1>
<p class="sub">Tap any excuse to copy it. Cheers for backing a bloke who’s not buying it.</p>
<button id="r">Give me a random one</button>
<p class="pick" id="pk"></p>
<div id="out"></div>
<p><a href="index.html">← Back to today’s excuse</a></p>
<script>
var G=[
["At the pub",["I only popped in for the one, and the one had friends.","I wasn’t drinking, I was supporting local business.","The meat tray was a raffle, I had to be there.","I’m not at the pub, I’m in the beer garden for the fresh air.","It’s a work meeting, it just happens to have a pool table.","My shout was only a short one, technically.","The trivia team needed me. It’s basically community service.","I only stayed for the footy and the footy had extra time.","Nobody told me there was a second half.","The jukebox ate my money, so I had to stay and win it back.","I’m not hungover, I’m recovering from a very long Tuesday.","It was only a quiet one, mate. Then it got loud.","I left at a reasonable hour, I just took the scenic route.","The parma was the size of a hubcap, so I had to sit it out.","I was the designated driver, for the ute’s feelings.","The raffle’s not rigged, I just have lucky hands.","I only had a sip, the rest was for the glass’s morale.","My phone died, and so did the signal, and the bar tab.","It’s a charity thing. The charity is me.","I only said I’d be home soon. Soon is a flexible word."]],
["Home and yard",["The lawn’s not long, it’s rewilding.","I’m not avoiding the gutters, I’m waiting for a dry weekend.","The shed isn’t a mess, it’s a filing system only I understand.","I bought the tool to save money on the tradie.","It’s only a small hole in the wall, and it was already there.","The barbie isn’t dirty, it’s seasoned.","I’m not ignoring the washing, I’m letting it air out.","The dishwasher’s fine, it just needs a rest.","I was always going to fix the fence, then the fence sort of fixed itself.","The bins went out, in spirit.","I only needed one screw and now I own the whole box.","It’s not a pile of junk, it’s a future project.","I’m not napping, I’m supervising the lawn from a horizontal position.","The ladder’s fine, I’ve done it loads of times.","I measured twice, it’s the wall that moved.","The spare room’s not a dumping ground, it’s a staging area.","I’ll paint it this weekend. Which weekend wasn’t specified.","The kettle’s not broken, it’s on a go-slow.","I didn’t break it, it was like that when I touched it.","The leak’s just a water feature I didn’t plan."]],
["At work",["I’m not slacking, I’m thinking with my eyes closed.","The meeting could’ve been an email, so I treated it like one.","I didn’t miss your message, it was just buried in the pile.","My internet dropped right when I was about to say something clever.","I’m on a very important call. It’s with my own thoughts.","The report’s nearly done. Nearly is doing a lot of work there.","I’m not late, my watch runs on a different philosophy.","I was in the carpark for ages, just psyching myself up.","The printer hates me, and I won’t be shamed.","It’s on my list, near the top, under the other things.","I only took one extra smoko. It was a long one.","I was working from home. The home had a very comfy couch.","I wasn’t on my phone, I was researching, mostly the footy.","The deadline’s more of a guideline, really.","I didn’t read the email, but I respect the sender.","The boss said “when you can”. I can’t yet.","I’m just recharging for a very busy afternoon.","I was going to ask, but the timing never felt right.","The spreadsheet broke itself, I swear.","I did it, it’s just in a place I can’t find."]],
["On the road",["I wasn’t speeding, the speedo’s optimistic.","The servo had a queue, so I went around the block. Five times.","I took the long way for the scenery. And the bakery.","The ute needs regular outings or it gets depressed.","I only went for a quick drive to the shops, in a different town.","The GPS said turn left, and it was wrong. I trusted it.","I’m not lost, I’m exploring an unplanned route.","I was checking the tyre pressure for ages, just to be safe.","I wasn’t on the phone, I was holding it for a mate.","The fuel light’s just a suggestion.","It was a very quick stop, and then the pie happened.","I only parked here for a sec. A long sec.","A roo came out of nowhere, and so did the three-hour delay.","I’m not tailgating, I’m drafting for fuel economy.","The car’s fine, it’s making that sound for attention.","I only went to get milk. I came back with a trailer.","My ute doesn’t do reverse parking, it has principles.","It’s not a detour, it’s a character-building route.","I was never going to be on time, so I was early for late.","The esky was heavy, so I had to stop for a rest. A big rest."]],
["Family and weekends",["I didn’t forget the birthday, I was building suspense.","I wasn’t ignoring the group chat, it got too long.","I only said I’d come if I could. I couldn’t.","The kids needed me, in the sense that I needed a nap.","I’ll be there by two. I didn’t say which day.","I’m not cooking tonight, the oven and I are on a break.","I didn’t eat the last biscuit, I protected it from going stale.","I’m not on the couch, I’m in a relaxed upright position.","The shopping list was in my head and my head’s on strike.","I only mentioned it once, and I said it quietly.","I wasn’t late for the barbie, the snags were early.","I’m not tired, I’m conserving energy for a rainy day.","The weekend went so quick, I blinked and it was Monday.","I said I’d do it, I never said when, mate.","It was a surprise party, I was just surprised I came.","I’m not sulking, I’m doing a very quiet protest.","The footy was on. That’s all that needs saying.","I was going to call, but then I got busy being busy.","It’s not a lie, it’s a creative version of the truth.","Fair dinkum, I’d tell you if it wasn’t true. Nearly always."]]
];
var all=[],n=0,h="";
G.forEach(function(g){h+="<h2>"+g[0]+"</h2><ol>";g[1].forEach(function(t){n++;all.push(t);h+="<li><b>"+n+".</b>"+t+"</li>"});h+="</ol>"});
document.getElementById("out").innerHTML=h;
function cp(t){try{navigator.clipboard.writeText(t)}catch(e){}}
document.getElementById("out").onclick=function(e){var l=e.target.closest("li");if(l){var t=l.textContent.replace(/^\d+\./,"");cp(t);document.getElementById("pk").textContent="Copied: "+t}};
document.getElementById("r").onclick=function(){var t=all[Math.floor(Math.random()*all.length)];document.getElementById("pk").textContent=t;cp(t)};
</script></main></body></html>
